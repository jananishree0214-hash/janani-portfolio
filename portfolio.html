<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Janani | Software Developer Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    (function() { emailjs.init("QRLM0avb-ZIfxmVz7"); })();
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #080706;
      --surface: rgba(212,175,55,0.03);
      --border: rgba(212,175,55,0.1);
      --violet: #d4af37;
      --indigo: #c9a227;
      --rose: #f5c518;
      --cyan: #e8c96d;
      --text: #f5f0e8;
      --muted: #8a8070;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom Cursor ── */
    #cursor-dot {
      width: 8px; height: 8px;
      background: var(--violet);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      transition: transform 0.05s;
      box-shadow: 0 0 12px var(--violet);
    }
    #cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(212,175,55,0.5);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      transition: all 0.12s ease;
    }
    body:has(a:hover) #cursor-ring,
    body:has(button:hover) #cursor-ring {
      transform: translate(-50%,-50%) scale(1.6);
      border-color: var(--rose);
    }

    /* ── Loading Screen ── */
    #loading-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loading-screen.hidden { opacity: 0; visibility: hidden; }
    .loader-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      background: linear-gradient(135deg, var(--violet), var(--rose));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: pulse-name 1.5s ease infinite alternate;
    }
    @keyframes pulse-name { from { opacity: 0.4; } to { opacity: 1; } }
    .loader-bar {
      width: 200px; height: 1px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px; overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, #b8860b, #d4af37, #f5c518);
      border-radius: 99px;
      animation: load-fill 1.8s ease forwards;
    }
    @keyframes load-fill { from { width: 0%; } to { width: 100%; } }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(#d4af37, #8b6914); border-radius: 99px; }

    /* ── Canvas Background ── */
    #particle-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }

    /* ── Animated Gradient Orbs ── */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(100px);
      pointer-events: none; z-index: 0; opacity: 0.18;
    }
    .orb-1 { width: 600px; height: 600px; top: -200px; left: -200px;
      background: radial-gradient(circle, #b8860b, transparent 70%);
      animation: orb-drift-1 18s ease-in-out infinite alternate; }
    .orb-2 { width: 500px; height: 500px; bottom: -150px; right: -100px;
      background: radial-gradient(circle, #8b6914, transparent 70%);
      animation: orb-drift-2 22s ease-in-out infinite alternate; }
    .orb-3 { width: 400px; height: 400px; top: 40%; left: 40%;
      background: radial-gradient(circle, #d4af37, transparent 70%);
      animation: orb-drift-3 15s ease-in-out infinite alternate; }
    @keyframes orb-drift-1 { from { transform: translate(0,0); } to { transform: translate(120px,80px); } }
    @keyframes orb-drift-2 { from { transform: translate(0,0); } to { transform: translate(-80px,-60px); } }
    @keyframes orb-drift-3 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,-40px) scale(1.2); } }

    /* ── Glassmorphism card ── */
    .glass {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ── Gradient text ── */
    .grad-text {
      background: linear-gradient(135deg, #d4af37 0%, #f5c518 50%, #e8c96d 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .grad-text-vp {
      background: linear-gradient(135deg, #d4af37, #f5c518);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Typing cursor ── */
    .typing-cursor::after {
      content: '|'; animation: blink 0.8s step-end infinite;
      color: #d4af37; font-weight: 200;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    /* ── Glow button ── */
    .btn-glow {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      border: none; color: #080706;
      padding: 14px 32px; border-radius: 50px;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem; letter-spacing: 0.05em;
      cursor: none; transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 30px rgba(212,175,55,0.3);
      text-decoration: none; display: inline-block; font-weight: 600;
    }
    .btn-glow:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 50px rgba(212,175,55,0.6), 0 0 80px rgba(184,134,11,0.3); }
    .btn-glow::before {
      content: ''; position: absolute; inset: -2px; border-radius: 50px;
      background: linear-gradient(135deg, #d4af37, #f5c518, #e8c96d);
      z-index: -1; opacity: 0; transition: opacity 0.3s;
    }
    .btn-glow:hover::before { opacity: 1; }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(212,175,55,0.4);
      color: var(--violet); padding: 13px 30px; border-radius: 50px;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem; letter-spacing: 0.05em;
      cursor: none; transition: all 0.3s ease;
      text-decoration: none; display: inline-block;
    }
    .btn-outline:hover { background: rgba(212,175,55,0.1); border-color: var(--violet); box-shadow: 0 0 20px rgba(212,175,55,0.2); transform: translateY(-2px); }

    /* ── Navbar ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 20px 40px;
      transition: all 0.4s ease;
    }
    nav.scrolled {
      background: rgba(5,5,8,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 40px;
    }
    .nav-link {
      position: relative; color: var(--muted);
      font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.3s; text-decoration: none; cursor: none;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .nav-link::after {
      content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
      height: 1px; background: linear-gradient(90deg, #d4af37, #f5c518);
      transform: scaleX(0); transition: transform 0.3s ease;
    }
    .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }

    /* ── Section ── */
    section { position: relative; z-index: 1; }

    /* ── Scroll reveal ── */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-right { opacity: 0; transform: translateX(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal-right.visible { opacity: 1; transform: translateX(0); }

    /* ── Skill card ── */
    .skill-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 24px 20px;
      transition: all 0.4s ease; cursor: default;
      position: relative; overflow: hidden;
    }
    .skill-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 16px;
      background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(184,134,11,0.08));
      opacity: 0; transition: opacity 0.4s;
    }
    .skill-card:hover { transform: translateY(-8px); border-color: rgba(212,175,55,0.3); box-shadow: 0 20px 60px rgba(212,175,55,0.1); }
    .skill-card:hover::before { opacity: 1; }

    /* ── Project card ── */
    .project-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px; overflow: hidden;
      transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
      position: relative;
    }
    .project-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(212,175,55,0.05), rgba(184,134,11,0.05));
      opacity: 0; transition: opacity 0.4s;
    }
    .project-card:hover { transform: translateY(-12px) scale(1.01); border-color: rgba(212,175,55,0.25); box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 40px rgba(212,175,55,0.12); }
    .project-card:hover::after { opacity: 1; }

    /* ── Timeline ── */
    .timeline-line {
      position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg, transparent, #d4af37, #b8860b, transparent);
    }
    .timeline-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #b8860b);
      box-shadow: 0 0 15px rgba(212,175,55,0.6);
      flex-shrink: 0;
    }

    /* ── Certificate card ── */
    .cert-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 28px;
      transition: all 0.4s ease; position: relative; overflow: hidden;
    }
    .cert-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #d4af37, #f5c518, #e8c96d);
      transform: scaleX(0); transition: transform 0.4s ease;
    }
    .cert-card:hover { transform: translateY(-6px); border-color: rgba(167,139,250,0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .cert-card:hover::before { transform: scaleX(1); }

    /* ── Contact ── */
    .contact-input {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 16px 20px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      transition: all 0.3s ease; outline: none;
    }
    .contact-input:focus { border-color: rgba(212,175,55,0.4); box-shadow: 0 0 20px rgba(212,175,55,0.1); background: rgba(255,255,255,0.06); }
    .contact-input::placeholder { color: var(--muted); }

    /* ── Social icon ── */
    .social-icon {
      width: 44px; height: 44px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: all 0.3s ease;
      text-decoration: none; cursor: none;
    }
    .social-icon:hover { border-color: rgba(212,175,55,0.4); color: var(--violet); background: rgba(212,175,55,0.08); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(212,175,55,0.15); }

    /* ── Section header ── */
    .section-header { text-align: center; margin-bottom: 64px; }
    .section-label {
      font-family: 'Space Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: #d4af37;
      margin-bottom: 16px; display: block;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300; line-height: 1.1; color: var(--text);
    }
    .section-divider {
      width: 60px; height: 1px; margin: 20px auto 0;
      background: linear-gradient(90deg, #d4af37, #f5c518);
    }

    /* ── Floating icons ── */
    .float-icon {
      position: absolute; border-radius: 12px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      animation: float-anim var(--dur, 6s) ease-in-out infinite alternate;
      font-size: 1.2rem; color: rgba(212,175,55,0.4);
    }
    @keyframes float-anim {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-20px) rotate(8deg); }
    }

    /* ── Hero ── */
    .hero-greeting {
      font-family: 'Space Mono', monospace; font-size: 0.75rem;
      letter-spacing: 0.35em; color: #d4af37; text-transform: uppercase;
    }
    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 10vw, 7rem);
      font-weight: 300; line-height: 0.95; letter-spacing: -0.02em;
    }
    .hero-role {
      font-family: 'DM Sans', sans-serif; font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--muted); font-weight: 300;
    }

    /* ── Progress bar ── */
    .skill-bar-track {
      height: 3px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden;
    }
    .skill-bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #b8860b, #d4af37, #f5c518);
      transform: scaleX(0); transform-origin: left;
      transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .skill-bar-fill.animated { transform: scaleX(1); }

    /* ── Tag ── */
    .tag {
      font-family: 'Space Mono', monospace; font-size: 0.65rem;
      letter-spacing: 0.08em; padding: 5px 12px; border-radius: 99px;
      border: 1px solid rgba(212,175,55,0.25); color: var(--violet);
      background: rgba(212,175,55,0.07);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      nav.scrolled { padding: 12px 20px; }
      .nav-links { display: none; }
      .mobile-menu { display: flex !important; }
    }

    .mobile-menu { display: none; }

    /* ── About image frame ── */
    .about-frame {
      position: relative; border-radius: 24px; overflow: hidden;
      background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(184,134,11,0.12));
      border: 1px solid rgba(212,175,55,0.15);
    }
    .about-frame::before {
      content: ''; position: absolute; inset: -1px; border-radius: 25px;
      background: linear-gradient(135deg, #d4af37, #b8860b, #f5c518);
      z-index: -1; opacity: 0.3;
    }

    /* ── Stat card ── */
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 24px; text-align: center;
      transition: all 0.3s ease;
    }
    .stat-card:hover { border-color: rgba(167,139,250,0.2); transform: translateY(-4px); }
    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem; font-weight: 300;
    }
  </style>
</head>
<body>

  <!-- Cursor -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-name">Janani</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div style="font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.25em;color:var(--muted)">LOADING PORTFOLIO</div>
  </div>

  <!-- Ambient Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Particle Canvas -->
  <canvas id="particle-canvas"></canvas>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ─── Typing hook ─── */
    function useTyping(words, speed = 90, pause = 1800) {
      const [display, setDisplay] = useState('');
      const [wordIdx, setWordIdx] = useState(0);
      const [charIdx, setCharIdx] = useState(0);
      const [deleting, setDeleting] = useState(false);

      useEffect(() => {
        const word = words[wordIdx];
        let timeout;
        if (!deleting && charIdx < word.length) {
          timeout = setTimeout(() => setCharIdx(c => c + 1), speed);
        } else if (!deleting && charIdx === word.length) {
          timeout = setTimeout(() => setDeleting(true), pause);
        } else if (deleting && charIdx > 0) {
          timeout = setTimeout(() => setCharIdx(c => c - 1), speed / 2);
        } else if (deleting && charIdx === 0) {
          setDeleting(false);
          setWordIdx(w => (w + 1) % words.length);
        }
        setDisplay(word.slice(0, charIdx));
        return () => clearTimeout(timeout);
      }, [charIdx, deleting, wordIdx, words, speed, pause]);

      return display;
    }

    /* ─── Scroll reveal hook ─── */
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('visible'); }
          });
        }, { threshold: 0.12 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    /* ─── Skill bar animation hook ─── */
    function useSkillBars() {
      useEffect(() => {
        const bars = document.querySelectorAll('.skill-bar-fill');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) e.target.classList.add('animated');
          });
        }, { threshold: 0.3 });
        bars.forEach(b => obs.observe(b));
        return () => obs.disconnect();
      }, []);
    }

    /* ─── Navbar ─── */
    function Navbar() {
      const [scrolled, setScrolled] = useState(false);
      const [active, setActive] = useState('hero');
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 40);
          const sections = ['hero','about','skills','projects','experience','certificates','contact'];
          const current = sections.find(id => {
            const el = document.getElementById(id);
            if (!el) return false;
            const rect = el.getBoundingClientRect();
            return rect.top <= 120 && rect.bottom >= 120;
          });
          if (current) setActive(current);
        };
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const links = [
        { id: 'about', label: 'About' },
        { id: 'skills', label: 'Skills' },
        { id: 'projects', label: 'Projects' },
        { id: 'experience', label: 'Experience' },
        { id: 'certificates', label: 'Certificates' },
        { id: 'contact', label: 'Contact' },
      ];

      const scroll = (id) => {
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        setMenuOpen(false);
      };

      return (
        <nav className={scrolled ? 'scrolled' : ''}>
          <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            {/* Logo */}
            <button onClick={() => scroll('hero')} style={{ background: 'none', border: 'none', cursor: 'none' }}>
              <span style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: '1.5rem', fontWeight: 300, letterSpacing: '0.1em' }} className="grad-text">J.</span>
            </button>

            {/* Desktop links */}
            <div className="nav-links" style={{ display: 'flex', gap: 36 }}>
              {links.map(l => (
                <button key={l.id} onClick={() => scroll(l.id)} style={{ background: 'none', border: 'none' }}>
                  <span className={`nav-link ${active === l.id ? 'active' : ''}`}>{l.label}</span>
                </button>
              ))}
            </div>

            <a href="Janani_Resume.pdf" download="Janani_Resume.pdf" className="btn-glow" style={{ padding: '10px 24px', fontSize: '0.75rem' }}>Resume ↓</a>

            {/* Mobile menu btn */}
            <button className="mobile-menu" onClick={() => setMenuOpen(!menuOpen)} style={{ background: 'none', border: 'none', color: 'var(--text)', fontSize: '1.2rem', cursor: 'none', padding: 8 }}>
              {menuOpen ? '✕' : '☰'}
            </button>
          </div>

          {/* Mobile menu */}
          {menuOpen && (
            <div style={{ background: 'rgba(5,5,8,0.97)', backdropFilter: 'blur(20px)', padding: '20px', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
              {links.map(l => (
                <button key={l.id} onClick={() => scroll(l.id)} style={{ background: 'none', border: 'none', display: 'block', width: '100%', textAlign: 'left', padding: '12px 0' }}>

  <script>
    /* ── Loading Screen ── */
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
      }, 2200);
    });

    /* ── Custom Cursor ── */
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX; mouseY = e.clientY;
      dot.style.left = mouseX + 'px';
      dot.style.top = mouseY + 'px';
    });

    function animateRing() {
      ringX += (mouseX - ringX) * 0.12;
      ringY += (mouseY - ringY) * 0.12;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    /* ── Particle Canvas ── */
    (function() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const N = 80;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const colors = ['rgba(212,175,55,', 'rgba(184,134,11,', 'rgba(245,197,24,', 'rgba(232,201,109,'];

      for (let i = 0; i < N; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          alpha: Math.random() * 0.4 + 0.1,
          color: colors[Math.floor(Math.random() * colors.length)],
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color + p.alpha + ')';
          ctx.fill();
        });

        // Draw faint connecting lines
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(212,175,55,${0.04 * (1 - dist / 100)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
